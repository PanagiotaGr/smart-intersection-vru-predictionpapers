name: Unified PhD Research Pipeline

on:
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: "Πόσα παλιά ή ελλιπή papers θα αναλυθούν"
        required: false
        default: "20"
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

concurrency:
  group: unified-phd-research-pipeline
  cancel-in-progress: false

jobs:
  research-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install openai python-dotenv

      - name: Backfill historical Greek analyses
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_LIMIT: ${{ github.event.inputs.backfill_limit }}
        run: |
          LIMIT="${MANUAL_LIMIT:-20}"
          python scripts/backfill_paper_analyses_el.py \
            --db data/papers.json \
            --out data/paper_analyses_el.json \
            --legacy-out data/paper_summaries_el.json \
            --paper-dir data/papers_el \
            --report data/backfill_status_el.json \
            --limit "$LIMIT"

      - name: Rebuild Greek digest and topic library
        run: |
          python scripts/build_greek_digest.py
          python scripts/build_greek_topic_library.py

      - name: Build full-text provenance records
        run: |
          python scripts/build_fulltext_research_records.py \
            --papers data/papers.json \
            --extractions data/fulltext_extractions \
            --schema config/fulltext_claim_schema.json \
            --out data/fulltext_research_records.json \
            --paper-dir data/fulltext_records \
            --report thesis/quality/fulltext_provenance_report.json

      - name: Build complete thesis knowledge base
        run: |
          python scripts/build_thesis_knowledge_base.py \
            --papers data/papers.json \
            --analyses data/paper_analyses_el.json \
            --fallback-analyses data/paper_summaries_el.json \
            --taxonomy config/thesis_taxonomy.json \
            --out thesis

      - name: Build systematic Topic Navigator reviews
        run: |
          python scripts/build_systematic_topic_reviews.py \
            --config config/systematic_topic_reviews.json \
            --analyses data/paper_analyses_el.json \
            --claims data/fulltext_research_records.json \
            --out thesis/reviews

      - name: Audit scientific research quality
        run: |
          python scripts/audit_research_quality.py \
            --analyses data/paper_analyses_el.json \
            --schema config/research_quality_schema.json \
            --out thesis/quality

      - name: Commit all generated research outputs once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data thesis topics README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "All research outputs are already up to date."
          else
            git commit -m "Update unified PhD research knowledge base"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish pipeline summary
        if: always()
        run: |
          echo "## Unified PhD Research Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Historical backfill" >> "$GITHUB_STEP_SUMMARY"
          echo "- Greek digest and topic library" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full-text provenance validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Thesis knowledge-base generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Systematic Topic Navigator reviews" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scientific quality audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- One final commit and push" >> "$GITHUB_STEP_SUMMARY"
