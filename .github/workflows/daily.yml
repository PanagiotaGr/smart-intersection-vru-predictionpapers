name: Daily ArXiv Digest

on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai python-dotenv

      - name: Run daily fetch
        run: python scripts/fetch_arxiv_daily.py --config config.yml

      - name: Generate detailed Greek analyses
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Processes the next unsummarized papers, so the historical backlog
          # is gradually completed while new papers are always included.
          python scripts/summarize_papers_el.py --db data/papers.json --limit 40

      - name: Build daily Greek digest
        run: python scripts/build_greek_digest.py --min-score 6 --limit 40

      - name: Build Greek library for every topic
        run: |
          python scripts/build_greek_topic_library.py \
            --db data/papers.json \
            --summaries data/paper_summaries_el.json \
            --outdir topics/el

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily arXiv and Greek literature update"
            git push
          fi
