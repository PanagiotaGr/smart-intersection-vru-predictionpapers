name: Build Full-Text Provenance Records

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
  push:
    branches: [main]
    paths:
      - "data/papers.json"
      - "data/fulltext_extractions/**"
      - "config/fulltext_claim_schema.json"
      - "scripts/build_fulltext_research_records.py"

permissions:
  contents: write

concurrency:
  group: fulltext-provenance
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build provenance-aware records
        run: |
          python scripts/build_fulltext_research_records.py \
            --papers data/papers.json \
            --extractions data/fulltext_extractions \
            --schema config/fulltext_claim_schema.json \
            --out data/fulltext_research_records.json \
            --paper-dir data/fulltext_records \
            --report thesis/quality/fulltext_provenance_report.json
      - name: Commit validated research records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fulltext_research_records.json data/fulltext_records thesis/quality/fulltext_provenance_report.json
          if git diff --cached --quiet; then
            echo "Full-text provenance records are up to date."
          else
            git commit -m "Update full-text provenance research records"
            git push
          fi
