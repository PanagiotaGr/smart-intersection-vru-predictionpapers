name: Build Thesis Knowledge Base

on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * *"
  push:
    branches: [main]
    paths:
      - "data/papers.json"
      - "data/paper_analyses_el.json"
      - "data/paper_summaries_el.json"
      - "config/thesis_taxonomy.json"
      - "scripts/build_thesis_knowledge_base.py"

permissions:
  contents: write

concurrency:
  group: thesis-knowledge-base
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Greek IMPTC-centred knowledge base
        run: |
          python scripts/build_thesis_knowledge_base.py \
            --papers data/papers.json \
            --analyses data/paper_analyses_el.json \
            --fallback-analyses data/paper_summaries_el.json \
            --taxonomy config/thesis_taxonomy.json \
            --out thesis

      - name: Commit generated knowledge base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thesis
          if git diff --cached --quiet; then
            echo "Knowledge base is already up to date."
          else
            git commit -m "Update Greek IMPTC thesis knowledge base"
            git push
          fi
